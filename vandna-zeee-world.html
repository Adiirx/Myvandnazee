<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Vandna zeee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --gold: #ffcf85;
    --rose: #f08fa3;
    --card: rgba(255, 247, 249, 0.92);
    --ink: #3b1c32;
    --accent: #d94f78;
    --paper: #fff3f5;
    --paper-ink: #6d2848;
    --tile: #f6dfe5;
    --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    --hand: 'Caveat', Georgia, serif;
    --t: 0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card: rgba(34, 22, 38, 0.9);
      --ink: #fbe9ef;
      --accent: #ff8fb0;
      --paper: #2c1a2e;
      --paper-ink: #ffd9e4;
      --tile: #4a3049;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--serif); color: var(--ink); background: #14121f; overflow: hidden; -webkit-font-smoothing: antialiased; }

  /* ---------- sky: deep space that turns to sunrise as she explores ---------- */
  .sky, .sky-warm, .stars, .sun { position: fixed; pointer-events: none; }
  .sky { inset: 0; z-index: -5; background: radial-gradient(ellipse at 50% 40%, #2b2547 0%, #17142a 60%, #0d0b18 100%); }
  .sky-warm { inset: 0; z-index: -4; opacity: calc(var(--t) * 0.9); background: linear-gradient(180deg, #f6a5b5 0%, #ffc59a 50%, #ffe9b8 100%); }
  .stars {
    inset: 0; z-index: -3; opacity: calc(1 - var(--t) * 0.9);
    background-image:
      radial-gradient(1.6px 1.6px at 8% 12%, #fff, transparent), radial-gradient(1.2px 1.2px at 22% 34%, #fff, transparent),
      radial-gradient(1.8px 1.8px at 36% 8%, #fff, transparent), radial-gradient(1.2px 1.2px at 50% 22%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 64% 10%, #fff, transparent), radial-gradient(1.2px 1.2px at 78% 30%, #fff, transparent),
      radial-gradient(1.8px 1.8px at 92% 16%, #fff, transparent), radial-gradient(1.2px 1.2px at 12% 60%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 40% 76%, #fff, transparent), radial-gradient(1.2px 1.2px at 70% 64%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 90% 78%, #fff, transparent), radial-gradient(1.2px 1.2px at 28% 90%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 56% 92%, #fff, transparent), radial-gradient(1.2px 1.2px at 84% 48%, #fff, transparent);
    animation: twinkle 5s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { filter: brightness(0.7); } to { filter: brightness(1.35); } }
  .sun {
    z-index: -2; left: 50%; bottom: -180px; width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, #fff6d6 0%, #ffd98a 42%, rgba(255, 217, 138, 0) 70%);
    transform: translate(-50%, calc(var(--t) * -230px)); opacity: var(--t);
  }

  /* ---------- gate ---------- */
  .gate {
    position: fixed; inset: 0; z-index: 60; padding: 28px; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 38%, #2f2a4d 0%, #181530 62%, #0d0b18 100%);
    transition: opacity 1.6s ease, visibility 1.6s;
  }
  .gate.gone { opacity: 0; visibility: hidden; }
  .gate .big-cloud { width: 220px; height: 100px; border-radius: 60px; background: #0e0d18; filter: blur(10px); margin-bottom: 30px; animation: heavy 5s ease-in-out infinite; }
  @keyframes heavy { 50% { transform: translateY(9px); } }
  .gate h1 { font-size: clamp(2rem, 8.6vw, 2.9rem); line-height: 1.14; margin: 0 0 16px; color: #f6eff2; letter-spacing: -0.02em; max-width: 12em; }
  .gate p { font-size: 1.15rem; line-height: 1.65; color: #d9d5de; max-width: 21em; margin: 0 0 32px; font-style: italic; }
  .btn {
    font-family: var(--serif); font-size: 1.1rem; font-weight: 700; border: 0; border-radius: 999px;
    padding: 15px 36px; cursor: pointer; background: var(--gold); color: #3b1c32;
    box-shadow: 0 8px 22px rgba(255, 207, 133, 0.35); transition: transform 0.2s ease;
  }
  .btn:hover { transform: scale(1.04); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* ---------- chrome ---------- */
  .pill, .music { z-index: 30; position: fixed; top: calc(12px + env(safe-area-inset-top)); background: var(--card); color: var(--ink); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22); }
  .pill { left: 14px; padding: 8px 16px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; }
  .music { right: 14px; top: calc(8px + env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; font-size: 1.2rem; }
  .music.off { opacity: 0.55; text-decoration: line-through; }
  .hint {
    position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
    background: var(--card); color: var(--ink); padding: 10px 20px; border-radius: 999px; font-size: 0.95rem; font-weight: 600;
    opacity: 0; transition: opacity 0.8s ease; pointer-events: none; white-space: nowrap;
  }
  .hint.show { opacity: 1; }
  .toast {
    position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 45;
    background: var(--gold); color: #3b1c32; padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 0.98rem;
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease; text-align: center; max-width: 90vw;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
  }
  .toast.show { opacity: 1; }

  /* ---------- the world ---------- */
  .wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1; }
  .world {
    position: relative; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
    opacity: 0; transform: scale(0.15); transition: opacity 2.2s ease, transform 2.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .world.in { opacity: 1; transform: scale(1); }
  .world:active { cursor: grabbing; }
  .world::before {
    content: ''; position: absolute; inset: 4%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255, 170, 200, 0.28) 55%, rgba(120, 160, 255, 0.16) 68%, rgba(120, 160, 255, 0) 78%);
    filter: blur(14px);
  }
  .world canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  .pin {
    position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0;
    background: var(--card); font-size: 1.2rem; line-height: 40px; text-align: center; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35); opacity: 0; pointer-events: none; will-change: transform;
  }
  .pin.game { background: var(--gold); }
  .pin::after {
    content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--gold);
    animation: ping 2.4s ease-out infinite; pointer-events: none;
  }
  @keyframes ping { 0% { transform: scale(0.85); opacity: 0.9; } 100% { transform: scale(1.35); opacity: 0; } }
  .pin.seen { box-shadow: 0 0 0 3px var(--gold), 0 4px 14px rgba(0, 0, 0, 0.35); }
  .pin.seen::after { display: none; }
  .pin.seen::before {
    content: '✓'; position: absolute; right: -4px; top: -4px; width: 17px; height: 17px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 0.68rem; font-weight: 700; line-height: 17px; font-family: var(--serif); z-index: 1;
  }
  .pin.locked { filter: grayscale(1); }
  .pin.locked::after { display: none; }
  .pin .num {
    position: absolute; left: -3px; bottom: -3px; width: 17px; height: 17px; border-radius: 50%; background: var(--accent);
    color: #fff; font: 700 0.68rem/17px var(--serif); font-style: normal;
  }
  .tag {
    position: absolute; left: 0; top: 0; padding: 5px 12px; border-radius: 999px; background: var(--card); color: var(--ink);
    font-size: 0.8rem; font-weight: 700; white-space: nowrap; opacity: 0; pointer-events: none; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
  }
  .world.flat { transform: none; opacity: 1; width: min(94vw, 460px); height: auto; max-height: 80vh; overflow: auto; display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; padding: 70px 0 30px; }
  .world.flat::before { display: none; }
  .world.flat .pin { position: relative; opacity: 1; pointer-events: auto; transform: none !important; }
  .world.flat .tag { display: none; }

  /* ---------- a place (opened memory) ---------- */
  .place {
    position: fixed; inset: 0; z-index: 40; background: rgba(18, 10, 28, 0.74);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0s linear 0.4s;
  }
  .place.open { opacity: 1; visibility: visible; transition: opacity 0.4s ease, visibility 0s; }
  .stage { height: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 78px 18px 44px; -webkit-overflow-scrolling: touch; }
  .stage > :first-child { margin-top: auto; }
  .stage > :last-child { margin-bottom: auto; }
  .stage > * { width: 100%; max-width: 500px; }
  .close {
    position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 14px; z-index: 46; width: 46px; height: 46px; border-radius: 50%;
    border: 0; cursor: pointer; background: var(--gold); color: #3b1c32; font-size: 1.3rem; font-family: var(--serif); font-weight: 700;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }

  .ring { padding: 6px; border-radius: 28px; background: linear-gradient(150deg, var(--rose), var(--gold)); box-shadow: 0 14px 38px rgba(0, 0, 0, 0.45); }
  .frame { display: block; width: 100%; max-height: 52vh; max-height: 52dvh; object-fit: contain; background: #1c1a22; border-radius: 22px; }
  .frame.tall { max-height: 68vh; max-height: 68dvh; }
  img.frame { height: auto; }
  .words {
    margin: 18px 0 0; padding: 16px 18px; background: var(--card); color: var(--ink); border-radius: 20px;
    font-size: 1.04rem; line-height: 1.78; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }
  .words.short { font-size: 1.1rem; }
  .paper {
    background-color: var(--paper); color: var(--paper-ink); padding: 30px 24px 18px; border-radius: 6px 6px 20px 20px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4); font-family: var(--hand); font-size: 1.42rem; line-height: 1.6; font-weight: 500;
  }
  .paper p { margin: 0 0 1.1em; overflow-wrap: break-word; }
  .paper p.shout { font-weight: 600; }
  .finale-text {
    margin: 22px 0 0; text-align: center; background: var(--card); color: var(--ink); padding: 22px 18px; border-radius: 24px;
    font-size: clamp(1.7rem, 7vw, 2.4rem); line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }

  /* ---------- games ---------- */
  #games { display: none; }
  .game { background: var(--card); color: var(--ink); border-radius: 28px; padding: 22px 18px 20px; text-align: center; box-shadow: 0 14px 38px rgba(0, 0, 0, 0.4); }
  .game h3 { margin: 0 0 14px; font-size: 1.5rem; letter-spacing: -0.01em; }
  .status { min-height: 1.6em; margin: 14px 0 0; font-size: 1.05rem; font-weight: 600; color: var(--accent); }
  .mini { margin-top: 12px; border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; font-family: var(--serif); font-weight: 700; font-size: 0.95rem; background: var(--gold); color: #3b1c32; }
  .scratch-box { position: relative; width: 100%; height: 190px; border-radius: 20px; overflow: hidden; background: linear-gradient(135deg, #ffe3ea, #fff0c9); }
  .scratch-box .under { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 18px; font-size: 1.6rem; font-weight: 700; line-height: 1.25; color: #6d2848; text-align: center; }
  #scratch { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; transition: opacity 0.8s ease; }
  .ttt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }
  .ttt button { aspect-ratio: 1; border: 0; border-radius: 18px; background: var(--tile); font-size: 2.3rem; cursor: pointer; color: var(--ink); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.08); }
  .ttt button.win { background: var(--gold); }
  .find { display: grid; gap: 8px; margin: 0 auto; max-width: 320px; }
  .find button { aspect-ratio: 1; border: 0; border-radius: 14px; background: var(--tile); cursor: pointer; padding: 0; font-size: 1.5rem; }
  .find button.shake { animation: shake 0.35s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .puzzle { position: relative; margin: 0 auto; border-radius: 18px; overflow: hidden; background: var(--tile); touch-action: manipulation; }
  .puzzle .tile { position: absolute; border: 0; padding: 0; cursor: pointer; background-repeat: no-repeat; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.55); transition: left 0.18s ease, top 0.18s ease; }
  .puzzle .tile.hole { opacity: 0; pointer-events: none; }
  .puzzle.solved .tile { box-shadow: none; }
  .puzzle.solved .tile.hole { opacity: 1; }

  .balloon { position: fixed; bottom: -70px; z-index: 55; font-size: 2.1rem; pointer-events: none; animation: rise 6.5s ease-in forwards; }
  @keyframes rise { to { transform: translate(var(--dx), -118vh); opacity: 0.2; } }

  @media (prefers-reduced-motion: reduce) {
    .stars, .gate .big-cloud, .pin::after { animation: none; }
    .world { transition: opacity 0.6s ease; transform: none; }
    .balloon { display: none; }
    .puzzle .tile { transition: none; }
  }
</style>
</head>
<body>

<div class="sky"></div>
<div class="sky-warm"></div>
<div class="stars"></div>
<div class="sun"></div>

<section class="gate" id="gate">
  <div class="big-cloud" aria-hidden="true"></div>
  <h1>You have a rough dayy, my Vandna zeee</h1>
  <p>Don't worryyy, let's see the world we created.</p>
  <button class="btn" id="enter">Let's go</button>
</section>

<div class="pill" id="pill">lighter: 0%</div>
<button class="music" id="music" aria-label="Turn music on or off">♪</button>
<div class="hint" id="hint">Drag to spin, tap a place</div>
<div class="toast" id="toast"></div>

<audio id="bgm" loop preload="auto" src="https://raw.githubusercontent.com/Adiirx/Myvandnazee/main/Mitski%20-%20My%20Love%20Mine%20All%20Mine%20(Official%20Lyric%20Video)%20(1).mp3"></audio>

<div class="wrap">
  <div class="world" id="world">
    <div class="layer" id="pinLayer"></div>
  </div>
</div>

<div class="place" id="place" inert>
  <button class="close" id="close" aria-label="Close">✕</button>
  <div class="stage" id="stage"></div>
</div>

<!-- games live here until a pin opens them -->
<div id="games">
  <div class="game" id="game-scratch">
    <h3>Scratch to reveal</h3>
    <div class="scratch-box" id="scratchBox">
      <div class="under">You are my favourite personnn ❤️</div>
      <canvas id="scratch"></canvas>
    </div>
    <p class="status" id="scratchMsg"></p>
  </div>

  <div class="game" id="game-ttt">
    <h3>Tic-tac-toe</h3>
    <div class="ttt" id="ttt"></div>
    <p class="status" id="tttMsg">Your move, ❤️ goes first</p>
    <button class="mini" id="tttReset">Play again</button>
  </div>

  <div class="game" id="game-find">
    <h3>Find the heart</h3>
    <div class="find" id="find"></div>
    <p class="status" id="findMsg"></p>
    <button class="mini" id="findReset" hidden>Play again</button>
  </div>

  <div class="game" id="game-puzzle">
    <h3>Put our hug back together</h3>
    <div class="puzzle" id="puzzle"></div>
    <p class="status" id="puzzleMsg">Slide the pieces into place</p>
    <button class="mini" id="puzzleReset">Shuffle again</button>
  </div>
</div>

  var musicOn = true, started = false;
  bgm.volume = 0.4;

  /* =========================================================
     CONTENT: every place on the world
     ========================================================= */
  var PINS = [
    /* Just look at her */
    { id: 'h1', ch: 'Just look at her', emoji: '🌸', lat: 28, lon: -35, type: 'video', src: BASE + 'adiiisnotsocrazy_20261104_061642724.mp4',
      text: `Look at her. Just look at herrr. I don't know how you manage to look this beautiful without even trying, Vandna zeee. Your smile changes my whole day, and your eyes carry a softness I can never describe properly, no matter how many times I try. You think you're just being yourself here, but to me this is the prettiest thing in the world. I could watch this on repeat for hours and still find a new reason to fall for you. My prettiest girlll.` },
    { id: 'h2', ch: 'Just look at her', emoji: '🌷', lat: 30, lon: -12, type: 'video', src: BASE + 'adiiisnotsocrazy_20261104_061658653.mp4',
      text: `And thereee she is again, being unfairly adorable. The little things you do, the way you move, the way your face lights up, the tiny expressions you don't even notice, are exactly what I remember at random moments in my day. Beauty isn't only how you look, babyyy, it's the warmth that comes with it. You're pretty in a way that feels like home to me, and every time I watch this I feel so lucky that you're mine.` },
    { id: 'h3', ch: 'Just look at her', emoji: '🌼', lat: 12, lon: -45, type: 'video', src: BASE + 'adiiisnotsocrazy_20261104_061705194.mp4',
      text: `Some people are beautiful in photos. You are beautiful in moments, and this one is proof. The way you carry yourself, that natural grace, the simple little charm you have without even realising it, makes my heart go quiet and loud at the same time. I wish you could see yourself through my eyes just once, Vandna zeee, because then you'd never doubt how stunning you are. Not on your best day, not on your worst. Always.` },
    { id: 'h4', ch: 'Just look at her', emoji: '🌺', lat: 14, lon: -22, type: 'video', src: BASE + 'adiiisnotsocrazy_20261104_061718417.mp4',
      text: `This one is my weakness. Your cuteness in this video is honestly illegal, my babyyy. Your little reactions, your sweetness, that glow on your face, everything about it makes me smile like a fool in front of my phone. I know you get shy when I say all this, but I'll keep saying it anyway, because it's true. You are the prettiest girl I know, inside and out, and I never get tired of looking at you.` },
    { id: 'h5', ch: 'Just look at her', emoji: '💐', lat: 12, lon: 0, type: 'video', src: BASE + 'adiiisnotsocrazy_20261104_061728191.mp4',
      text: `If I had to pick one reason to wake up smiling, it would be you. Watching you here, I feel peace and excitement together, which only you can do to me. You're beautiful, my sweetheart, in that soft, natural, effortless way that no filter could ever copy. Whatever kind of day you're having, please remember this: you are loved, you are adored, and you are the most beautiful part of my world. ❤️` },

    /* Our hands */
    { id: 'hd1', ch: 'Our hands', emoji: '🤝', lat: 10, lon: 45, type: 'video', short: true, src: BASE + 'adiiisnotsocrazy_20261104_061735276.mp4',
      text: `Your hand in mine looks like such a small thing, but this is where I feel the safest. It says everything words can't. I never want to let go, Vandna zeee. Every walk, every aimless road, every quiet moment, I want it to feel exactly like this.` },
    { id: 'hd2', ch: 'Our hands', emoji: '🤍', lat: -6, lon: 68, type: 'video', short: true, src: BASE + 'adiiisnotsocrazy_20261104_061832683.mp4',
      text: `And again, our hands fit like they were always meant to. Whenever the world feels heavy, I'll be right here holding on to you, tighter than you think. Promise, my babyyy.` },

    /* That look */
    { id: 'lk', ch: 'That look', emoji: '👀', lat: 24, lon: 100, type: 'video', src: BASE + 'adiiisnotsocrazy_20261104_061759551.mp4',
      text: `Okay, pause. Look at how she's looking at me. That soft, adorable, slightly shy look that melts my whole heart. I don't know what's going on in that beautiful head of yours at this moment, but I hope it's something sweet, because it feels like you're looking at me like I'm someone special. And babyyy, you are the special one. That single look is enough to make me forget every bad day. I'd happily get lost in those eyes forever.` },
    { id: 'g-ttt', emoji: '⭕', lat: -4, lon: 95, type: 'game', game: 'ttt' },

    /* What you made for me */

  world.addEventListener('pointerdown', function (e) {
    if (!started || anim || place.classList.contains('open')) return;
    dragging = true; moved = 0; downX = lastX = e.clientX; downY = lastY = e.clientY;
    downPin = e.target.closest ? e.target.closest('.pin') : null;
    vel.x = vel.y = 0; lastTouch = performance.now();
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved = Math.max(moved, Math.hypot(e.clientX - downX, e.clientY - downY));
    if (moved > 8 && group) {
      group.rotation.y += dx * 0.0075;
      group.rotation.x = Math.max(-1.1, Math.min(1.1, group.rotation.x + dy * 0.0075));
      vel.y = dx * 0.0075 * 0.6; vel.x = dy * 0.0075 * 0.6;
    }
    lastTouch = performance.now();
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false; lastTouch = performance.now();
    if (moved <= 8 && downPin) {
      var p = PINS.filter(function (x) { return x.el === downPin; })[0];
      if (p) { vel.x = vel.y = 0; tapPin(p); }
    }
    downPin = null;
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  /* flat fallback if WebGL or three.js is unavailable */
  function flatMode() {
    world.classList.add('flat');
    PINS.forEach(function (p) {
      p.el.addEventListener('click', function () { if (p.type === 'finale' && !unlocked) { toast('Visit every memory first 💗 (' + leftCount() + ' left)'); return; } openPlace(p); });
    });
    tags.forEach(function (l) { l.el.remove(); });
  }

  /* =========================================================
     START
     ========================================================= */
  function startWorld() {
    started = true;
    musicOn = true; musicBtn.classList.remove('off'); playMusic();
    gate.classList.add('gone');
    sizeWorld();
    requestAnimationFrame(function () { world.classList.add('in'); });
    if (group) {
      tmp = new THREE.Vector3();
      requestAnimationFrame(tick);
      setTimeout(function () { pinsOn = true; hint.classList.add('show'); }, 2300);
      setTimeout(function () { hint.classList.remove('show'); }, 9500);
    } else {
      hint.classList.remove('show');
    }
  }
  document.getElementById('enter').addEventListener('click', function () {
    if (started) return;
    if (texReady) startWorld(); else wantStart = true;
  });
  window.addEventListener('resize', function () { sizeWorld(); });

  setTimeout(function () {
    var ok = window.THREE && buildScene();
    if (!ok) { flatMode(); }
    texReady = true;
    if (wantStart) startWorld();
  }, 60);

  /* =========================================================
     GAMES
     ========================================================= */
  /* --- scratch card --- */
  (function () {
    var box = document.getElementById('scratchBox'), cvs = document.getElementById('scratch'), msg = document.getElementById('scratchMsg');
    var ctx = cvs.getContext('2d'), drawing = false, last = null, moves = 0, done = false;
    function paint() {
      var w = box.clientWidth, h = box.clientHeight;
      if (!w || !h) return;
      var dpr = Math.min(2, window.devicePixelRatio || 1);
      cvs.width = w * dpr; cvs.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      var g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#b8b2c8'); g.addColorStop(0.5, '#ecdca9'); g.addColorStop(1, '#c9a0b6');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(70, 30, 55, 0.6)'; ctx.font = '700 24px Georgia, serif'; ctx.textAlign = 'center';
      ctx.fillText('scratch here', w / 2, h / 2 + 8);
    }
    function pos(e) { var r = cvs.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function cleared() {
      var w = cvs.width, h = cvs.height, d = ctx.getImageData(0, 0, w, h).data, c = 0, total = 0, step = 16;
      for (var y = 0; y < h; y += step) for (var x = 0; x < w; x += step) { total++; if (d[(y * w + x) * 4 + 3] < 40) c++; }
      return c / total;
    }
    function scratch(p) {
      ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 44; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(last ? last.x : p.x, last ? last.y : p.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
      if (++moves % 6 === 0 && !done && cleared() > 0.45) {
        done = true; cvs.style.opacity = '0'; cvs.style.pointerEvents = 'none'; msg.textContent = 'You found it 💗'; burst(10);
      }
    }
    cvs.addEventListener('pointerdown', function (e) { drawing = true; last = null; cvs.setPointerCapture(e.pointerId); scratch(pos(e)); });
    cvs.addEventListener('pointermove', function (e) { if (drawing && !done) scratch(pos(e)); });
    ['pointerup', 'pointercancel'].forEach(function (ev) { cvs.addEventListener(ev, function () { drawing = false; last = null; }); });
    hooks.scratch = function () { if (!done) paint(); };
  })();

  /* --- tic-tac-toe (she always wins) --- */
  (function () {
    var el = document.getElementById('ttt'), msg = document.getElementById('tttMsg');
    var lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    var board, over, cells = [];
    for (var i = 0; i < 9; i++) {
      (function (i) {
        var b = document.createElement('button'); b.setAttribute('aria-label', 'cell ' + (i + 1));
        b.addEventListener('click', function () { play(i); }); el.appendChild(b); cells.push(b);
      })(i);
    }
    function render() { cells.forEach(function (b, i) { b.textContent = board[i] === 'H' ? '❤️' : board[i] === 'C' ? '🌙' : ''; }); }
    function lineOf(p) { for (var k = 0; k < lines.length; k++) { if (lines[k].every(function (i) { return board[i] === p; })) return lines[k]; } return null; }
    function reset() { board = Array(9).fill(''); over = false; cells.forEach(function (b) { b.classList.remove('win'); }); msg.textContent = 'Your move, ❤️ goes first'; render(); }
    function finish(l, text) { over = true; msg.textContent = text; if (l) l.forEach(function (i) { cells[i].classList.add('win'); }); }
    function play(i) {
      if (over || board[i]) return;
      board[i] = 'H'; render();
      var w = lineOf('H');
      if (w) { finish(w, 'You win! Of course you did 😌'); burst(10); return; }
      setTimeout(cpu, 420);
    }
    function cpu() {
      if (over) return;
      var empty = []; board.forEach(function (v, i) { if (!v) empty.push(i); });
      if (!empty.length) { finish(null, 'A tie? Let me play worse this time 😌'); return; }
      var best = null, bestScore = 99;
      empty.forEach(function (i) {
        var score = 0;
        lines.forEach(function (l) {
          if (l.indexOf(i) === -1) return;
          var h = l.filter(function (j) { return board[j] === 'H'; }).length;
          var c = l.filter(function (j) { return board[j] === 'C'; }).length;
          if (h > 0 && c === 0) score += h * 3;
        });
        board[i] = 'C'; if (lineOf('C')) score += 50; board[i] = '';
        score += Math.random();
        if (score < bestScore) { bestScore = score; best = i; }
      });
      board[best] = 'C'; render();
      if (!board.some(function (v) { return !v; })) finish(null, 'A tie? Let me play worse this time 😌');
    }
    document.getElementById('tttReset').addEventListener('click', reset);
    reset();
  })();

  /* --- find the heart --- */
  (function () {
    var grid = document.getElementById('find'), msg = document.getElementById('findMsg'), again = document.getElementById('findReset');
    var sizes = [3, 4, 5], round = 0;
    function build() {
      var n = sizes[round], target = Math.floor(Math.random() * n * n);
      grid.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)'; grid.innerHTML = '';
      msg.textContent = 'Round ' + (round + 1) + ' of ' + sizes.length;
      for (var i = 0; i < n * n; i++) {
        (function (i) {
          var b = document.createElement('button'); b.textContent = i === target ? '💗' : '🤍'; b.setAttribute('aria-label', 'heart ' + (i + 1));
          b.addEventListener('click', function () {
            if (i === target) {
              round++;
              if (round >= sizes.length) { grid.innerHTML = ''; msg.textContent = 'You found it. My heart was always with you ❤️'; again.hidden = false; burst(12); }
              else { burst(3); build(); }
            } else { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
          });
          grid.appendChild(b);
        })(i);
      }
    }
    again.addEventListener('click', function () { round = 0; again.hidden = true; build(); });
    build();
  })();

  /* --- sliding photo puzzle --- */
  (function () {
    var board = document.getElementById('puzzle'), msg = document.getElementById('puzzleMsg');
    var L = Math.min(window.innerWidth * 0.8, 320), tile = L / 3;
    var iw = 1, ih = 1, order = [], tiles = [], solved = false;
    board.style.width = board.style.height = L + 'px';
    for (var v = 0; v < 9; v++) {
      (function (v) {
        var t = document.createElement('button'); t.className = 'tile' + (v === 8 ? ' hole' : '');
        t.style.width = t.style.height = tile + 'px'; t.setAttribute('aria-label', 'piece ' + (v + 1));
        t.addEventListener('click', function () { move(order.indexOf(v)); }); board.appendChild(t); tiles.push(t);
      })(v);
    }
    function style() {
      var ratio = iw / ih, sw = ratio >= 1 ? 3 * tile * ratio : 3 * tile, sh = ratio >= 1 ? 3 * tile : 3 * tile / ratio;
      var ox = (sw - 3 * tile) / 2, oy = (sh - 3 * tile) / 2;
      tiles.forEach(function (t, v) {
        t.style.backgroundImage = 'url("' + HUG_PHOTO + '")'; t.style.backgroundSize = sw + 'px ' + sh + 'px';
        t.style.backgroundPosition = (-((v % 3) * tile + ox)) + 'px ' + (-(Math.floor(v / 3) * tile + oy)) + 'px';
      });
    }
    function placeTiles() { order.forEach(function (v, pos) { tiles[v].style.left = (pos % 3) * tile + 'px'; tiles[v].style.top = Math.floor(pos / 3) * tile + 'px'; }); }
    function neighbours(p) { var r = Math.floor(p / 3), c = p % 3, out = []; if (r > 0) out.push(p - 3); if (r < 2) out.push(p + 3); if (c > 0) out.push(p - 1); if (c < 2) out.push(p + 1); return out; }
    function move(p) {
      if (solved) return;
      var e = order.indexOf(8); if (neighbours(e).indexOf(p) === -1) return;
      order[e] = order[p]; order[p] = 8; placeTiles();
      if (order.every(function (v, i) { return v === i; })) { solved = true; board.classList.add('solved'); msg.textContent = 'Our hug, back together ❤️'; burst(12); }
    }
    function shuffle() {
      order = [0, 1, 2, 3, 4, 5, 6, 7, 8]; solved = false; board.classList.remove('solved'); msg.textContent = 'Slide the pieces into place';
      var e = 8, prevPos = -1;
      for (var i = 0; i < 160; i++) {
        var opts = neighbours(e).filter(function (x) { return x !== prevPos; });
        var p = opts[Math.floor(Math.random() * opts.length)];
        order[e] = order[p]; order[p] = 8; prevPos = e; e = p;
      }
      if (order.every(function (v, i) { return v === i; })) return shuffle();
      placeTiles();
    }
    var img = new Image();
    img.onload = function () { iw = img.naturalWidth || 1; ih = img.naturalHeight || 1; style(); };
    img.src = HUG_PHOTO;
    style(); shuffle();
    document.getElementById('puzzleReset').addEventListener('click', shuffle);
  })();

})();
</script>
</body>
